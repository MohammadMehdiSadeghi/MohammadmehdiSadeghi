<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todo app</title>
<meta name="theme-color" content="#0f3460">
<link rel="stylesheet" href="style.css">
</head>
<body>

<script>
// لغو سرویس‌ورکر قدیمی که باعث کش نسخه قدیمی app.js شده بود
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(r) {
    r.forEach(function(reg) { reg.unregister(); });
  });
}
</script>

<!-- اپ اصلی (تک‌کاربره، بدون ورود) -->
<div id="appScreen" class="screen">
  <header class="topbar">
    <div class="topbar-title">
      <strong id="meName">-</strong>
      <span class="muted small" id="todayLabel">-</span>
    </div>
    <div class="topbar-actions">
      <button id="themeToggleBtn" class="icon-btn-plain" title="تغییر تم" aria-label="تغییر تم">
        <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="today">امروز</button>
    <button class="tab-btn" data-tab="progress">در حال انجام</button>
    <button class="tab-btn" data-tab="week">هفته پیش رو</button>
    <button class="tab-btn" data-tab="history">تاریخچه</button>
  </nav>

  <main id="mainContent">
    <section id="tab-today" class="tab-panel active">
      <div id="todayList" class="task-list"></div>
    </section>

    <section id="tab-progress" class="tab-panel">
      <div id="progressContent"></div>
    </section>

    <section id="tab-week" class="tab-panel">
      <div id="weekList"></div>
    </section>

    <section id="tab-history" class="tab-panel">
      <div class="history-controls">
        <div class="jalali-range">
          <div class="jalali-date-group">
            <span class="muted small">از:</span>
            <select id="historyFromYear"></select>
            <select id="historyFromMonth"></select>
            <select id="historyFromDay"></select>
          </div>
          <div class="jalali-date-group">
            <span class="muted small">تا:</span>
            <select id="historyToYear"></select>
            <select id="historyToMonth"></select>
            <select id="historyToDay"></select>
          </div>
        </div>
        <button id="historyReload" class="btn small">به‌روزرسانی</button>
      </div>
      <div id="historyList" class="task-list"></div>
    </section>
  </main>

  <button id="addTaskFab" class="fab" aria-label="افزودن کار">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- مودال افزودن/ویرایش تسک -->
<div id="taskModal" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modalTitle">کار جدید</h2>
    <form id="taskForm">
      <input type="hidden" id="taskId">
      <label>عنوان *</label>
      <input type="text" id="taskTitle" required>

      <label>توضیحات</label>
      <textarea id="taskDescription" rows="2"></textarea>

      <div class="time-row">
        <div>
          <label>ساعت شروع (اختیاری)</label>
          <input type="text" id="taskStartTime" inputmode="numeric" placeholder="مثلا 14:00" pattern="^([01]?[0-9]|2[0-3]):[0-5][0-9]$" maxlength="5">
        </div>
        <div>
          <label>ساعت پایان (اختیاری)</label>
          <input type="text" id="taskEndTime" inputmode="numeric" placeholder="مثلا 15:30" pattern="^([01]?[0-9]|2[0-3]):[0-5][0-9]$" maxlength="5">
        </div>
      </div>
      <p class="hint-red">توجه : قالب زمانی 24 ساعته هست</p>
      <p class="muted small time-hint">اگه هم ساعت شروع و هم پایان رو بزنی، تو تب «در حال انجام» زمان باقی‌مانده رو خودکار براش حساب می‌کنیم.</p>

      <label>این کار برای چه روزهایی است؟ *</label>
      <div class="days-picker" id="daysPicker">
        <button type="button" class="day-chip" data-day="6">شنبه</button>
        <button type="button" class="day-chip" data-day="0">یک‌شنبه</button>
        <button type="button" class="day-chip" data-day="1">دوشنبه</button>
        <button type="button" class="day-chip" data-day="2">سه‌شنبه</button>
        <button type="button" class="day-chip" data-day="3">چهارشنبه</button>
        <button type="button" class="day-chip" data-day="4">پنج‌شنبه</button>
        <button type="button" class="day-chip" data-day="5">جمعه</button>
      </div>
      <button type="button" id="allDaysBtn" class="btn ghost small">انتخاب همه روزها (هر روز)</button>

      <div id="taskError" class="error-text"></div>

      <div class="modal-actions">
        <button type="button" id="deleteTaskBtn" class="btn danger hidden">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          حذف
        </button>
        <button type="button" id="cancelTaskBtn" class="btn ghost">انصراف</button>
        <button type="submit" class="btn primary">ذخیره</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden">
  <div class="toast-row">
    <span id="toastText" class="toast-text"></span>
    <button type="button" id="toastUndo" class="toast-undo hidden">لغو انجام‌شدن</button>
  </div>
  <div id="toastBar" class="toast-bar"></div>
</div>

<script src="demo-store.js"></script>
<script src="app.js"></script>
</body>
</html>
