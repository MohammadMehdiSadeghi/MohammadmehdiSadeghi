<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C7A40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2BCE63;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <style>
      @keyframes sweep { 0% { transform: translateX(-120%); } 60%,100% { transform: translateX(120%); } }
      @keyframes glow { 0%,100% { opacity:0.55; } 50% { opacity:1; } }
      @keyframes floatIn { 0% { opacity:0; transform: scale(0.85); } 100% { opacity:1; transform: scale(1); } }
      .shine { animation: sweep 3.5s ease-in-out infinite; }
      .glow { animation: glow 3s ease-in-out infinite; }
      .title-t { animation: floatIn 0.8s ease-out both; }
    </style>
  </defs>
  <rect width="400" height="300" fill="url(#g)" rx="12" />
  <rect class="glow" width="400" height="300" fill="url(#shine)" rx="12" opacity="0.5" />
  <rect class="shine" width="400" height="300" fill="url(#shine)" rx="12" />
  <text class="title-t" x="200" y="145" text-anchor="middle" dominant-baseline="central" font-size="80" font-weight="bold" font-family="sans-serif" fill="#ffffff" opacity="0.95">ته</text>
  <text x="200" y="262" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#ffffff" opacity="0.7">contract-writing-techniques-for-programmers</text>
</svg>