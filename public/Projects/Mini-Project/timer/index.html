<!DOCTYPE html>
<html lang="fa" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="card">
      <section class="timer">
        <div class="minutes">
          <span class="tow-minutes">0</span><span class="one-minutes">0</span>
        </div>
        <p>:</p>
        <div class="seconds">
          <span class="tow-seconds">0</span><span class="one-seconds">0</span>
        </div>
        <p>:</p>
        <div class="seconds-speed">
          <span class="tow-seconds-speed">0</span><span class="one-seconds-speed">0</span>
        </div>
      </section>

      <section class="btns">
        <button class="start">start</button>
        <button class="stop">stop</button>
        <button class="lap">lap</button>
        <button class="reset">reset</button>
      </section>

      <div class="lap-box"></div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
